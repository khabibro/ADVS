[project]
name = "advs-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "pillow>=10.4",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pydantic>=2.8",
  "pymupdf>=1.24",
  "python-json-logger>=2.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]
paddle = [
  "paddleocr==3.2.0",
  "paddlepaddle==3.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false
